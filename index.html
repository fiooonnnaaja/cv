<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Fiona</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f3e8ff;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 30px 20px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(147, 51, 234, 0.15);
      text-align: center;
    }
    .badge {
      background: #fae8ff;
      color: #c026d3;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 15px;
      border: 1px solid #f5d0fe;
    }
    h1 {
      font-family: 'Fredoka', sans-serif;
      color: #7e22ce;
      font-size: 28px;
      margin: 10px 0;
    }
    .sub {
      color: #6b21a8;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    .btn {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: white;
      padding: 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
    }
    .btn-outline {
      background: white;
      color: #a855f7;
      border: 2px solid #f0abfc;
      padding: 10px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Pelajar SMA & Petualang Muda 💜</div>
    <h1>Halo, Aku<br>FIONA 💜</h1>
    <p class="sub">Siswi aktif yang ceria, suka belajar bahasa Inggris, dan selalu bersemangat meraih berbagai hal baru!</p>

    <div class="btn">Tentang Saya</div>
    <div class="btn-outline">Pendidikan</div>
  </div>

</body>
</html>
